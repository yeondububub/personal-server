server:
  # NPM(Nginx Proxy Manager) 등 리버스 프록시 연결용 외부 공개 리스너
  public_addr: "0.0.0.0:8080"
  # Tailscale 또는 내부망 전용 관리 리스너 (비워두면 Public 리스너만 실행)
  private_addr: "127.0.0.1:8081"
  # 외부 공유 링크 생성 시 표시할 기본 도메인 (비워두면 현재 접속 Host 헤더 사용)
  public_base_url: ""
  # 쿠키 Secure 플래그 (HTTPS 전용 환경에서만 true 권장, HTTP 내부망 병행 시 false)
  cookie_secure: false
  # true로 설정하면 Public 리스너에서도 터미널·Docker·마운트 관리 등 전체 관리자 기능 허용
  allow_public_admin: false

storage:
  database_path: "./data/personal-server.db"
  temp_upload_dir: "./data/uploads"
  stacks_dir: "./data/stacks"
  # File Station에 마운트할 초기 루트 디렉토리 목록 (실행 후 웹 '마운트 관리'에서도 추가 가능)
  roots:
    - id: "media"
      name: "Media (영상/미디어)"
      path: "./data/roots/media"
    - id: "workspace"
      name: "Workspace (작업 폴더)"
      path: "./data/roots/workspace"

auth:
  # 최초 실행 시 관리자 계정이 없을 때 생성할 초기 계정 정보
  initial_admin_username: "admin"
  initial_admin_password: "changeme123!"
  session_ttl_hours: 168

wargame:
  # 워게임 컨테이너 포트를 바인딩할 인터페이스 IP (실서버에서는 Tailscale IP 예: "100.x.y.z" 권장)
  bind_ip: "127.0.0.1"
  port_start: 30000
  port_end: 39999
  work_dir: "./data/wargames"
  default_ttl_hours: 3
  max_archive_bytes: 1073741824

